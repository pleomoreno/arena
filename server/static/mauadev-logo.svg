    extension and the one <img src> reference in components/page.rs.
  -->
  <defs>
    <linearGradient id="mauadev-grad" x1="3" y1="6" x2="29" y2="6" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1670C7" />
      <stop offset="1" stop-color="#E8202D" />
    </linearGradient>
  </defs>
  <path d="M3 6 L16 6 L29 6 L18 27 L14 27 Z" fill="url(#mauadev-grad)" opacity=".14" />
