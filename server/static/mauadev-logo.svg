<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" fill="none" aria-hidden="true">
  <!--
    PLACEHOLDER MARK — replace this file with the real Dev Community Mauá
    logo (same filename: mauadev-logo.svg) and the nav picks it up with no
